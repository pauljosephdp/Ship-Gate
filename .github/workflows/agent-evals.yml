# Continuous evals (AI-native SDLC, Test stage): the configuration that steers Claude here
# (CLAUDE.md, REVIEW.md, .claude/ hooks and agents) is regression-tested like code. Runs on a
# pull request that changes it, weekly, and by hand. A pass rate below evals/threshold fails the
# check, so a configuration change that makes the agent worse is reviewed before it merges.
# Add an eval (evals/*.json, run by evals/run.sh) for every mistake the agent made twice.
name: Agent evals

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['CLAUDE.md', 'REVIEW.md', '.claude/**', 'templates/caller/.claude/**', 'evals/**', '.github/workflows/agent-evals.yml']
  schedule:
    - cron: "23 5 * * 1"   # Mondays, 05:23 UTC
  workflow_dispatch:

concurrency:
  group: agent-evals-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evals:
    name: agent-evals
    if: github.event.pull_request.draft != true && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Tools
        run: |
          npm install -g --no-audit --no-fund --loglevel=error @anthropic-ai/claude-code@2.1.293
          sudo apt-get install -y -qq shellcheck >/dev/null
      - name: Run the eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::warning::No ANTHROPIC_API_KEY secret: agent evals did not run."; exit 0; fi
          git config --global user.email evals@ship-gate.invalid && git config --global user.name "Ship Gate evals"
          bash evals/run.sh
