# Claude in the PR review loop (AI-native SDLC, Deploy stage).
# - review: every pull request that is ready for review, and each push to it, gets the
#   passes in REVIEW.md as inline findings plus one summary comment. Findings inform the
#   code owner (.github/CODEOWNERS), who approves; the review never approves or blocks.
# - mention: "@claude" in a PR comment from someone with write access asks Claude to address
#   it (owners, members and collaborators only); Claude pushes to the PR branch, never to main (branch protection and hooks).
# Needs the ANTHROPIC_API_KEY repository secret; without it each job notes that and passes.
# Dependabot PRs get no secrets and are skipped.
name: Claude

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name == 'pull_request' && 'review' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  review:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: API key present?
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::No ANTHROPIC_API_KEY secret: Claude did not run. Add the secret to turn it on."; fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: steps.key.outputs.present == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is checked out.
            Follow REVIEW.md at the repo root (passes, what counts as Important, the nit cap,
            what not to report) and CLAUDE.md. If the PR adds or changes a
            docs/changes/*/plan.md, check the diff against it (files that change, proof).
            Use `gh pr diff` and `gh pr view` to read the change.
            Post each specific finding as an inline comment with the inline comment tool,
            starting with "[Important]" or "[Nit]" and the pass name. Then post one
            top-level summary with `gh pr comment`: findings per pass and the nit count, or
            "No findings." Do not approve or request changes.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

  mention:
    if: >-
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      && ((github.event_name == 'issue_comment' && github.event.issue.pull_request
           && contains(github.event.comment.body, '@claude'))
        || (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: API key present?
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::No ANTHROPIC_API_KEY secret: Claude did not run. Add the secret to turn it on."; fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        if: steps.key.outputs.present == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
