# Every change to Ship Gate must prove the guards and config rules still bite
# before any site adopts the new version.
name: Self-test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    name: self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ShellCheck
        run: shellcheck -S error scripts/*.sh test/*.sh
      - name: Guards and config rules
        run: bash scripts/self-test.sh

  # The whole action, end to end, against a tiny conforming site, then against
  # copies broken one way each. The conforming run must pass; every broken run
  # must fail on the check that owns the fault.
  fixture:
    name: fixture (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: conforming, fails: "" }
          - { variant: missing-alt, fails: "Smoke, axe, reflow, CSP, edge" }
          - { variant: wide-element, fails: "Smoke, axe, reflow, CSP, edge" }
          - { variant: csp-violation, fails: "Smoke, axe, reflow, CSP, edge" }
          - { variant: bad-redirect, fails: "Smoke, axe, reflow, CSP, edge" }
          - { variant: two-h1, fails: "Structure scan" }
          - { variant: direct-tag, fails: "Stack guards" }
          - { variant: blocks-ai-search, fails: "Discovery (SEO, AEO, GEO, AIO)" }
          - { variant: bad-jsonld, fails: "Discovery (SEO, AEO, GEO, AIO)" }
          - { variant: robots-no-agents, fails: "Discovery (SEO, AEO, GEO, AIO)" }
          - { variant: rtl-no-dir, fails: "Discovery (SEO, AEO, GEO, AIO)" }
          - { variant: google-font, fails: "Market scan" }
          - { variant: no-focus-ring, fails: "Smoke, axe, reflow, CSP, edge" }
          - { variant: tracker-cookie, fails: "Smoke, axe, reflow, CSP, edge" }
    steps:
      - uses: actions/checkout@v4
      - name: Break the fixture
        run: bash test/break-fixture.sh ${{ matrix.variant }}
      - name: Ship Gate
        id: gate
        continue-on-error: true
        uses: ./
        with:
          working-directory: test/fixture-site
      - name: Expected result
        env:
          OUTCOME: ${{ steps.gate.outcome }}
          FAILS: ${{ matrix.fails }}
        run: |
          cat "$SHIP_GATE_DIR/summary.md"
          if [ -z "$FAILS" ]; then
            [ "$OUTCOME" = success ] || { echo "::error::The conforming fixture must pass the gate."; exit 1; }
          else
            [ "$OUTCOME" = failure ] || { echo "::error::Variant ${{ matrix.variant }} must fail the gate, but it passed."; exit 1; }
            grep -qF "| $FAILS | ❌ failed |" "$SHIP_GATE_DIR/summary.md" \
              || { echo "::error::Variant ${{ matrix.variant }} must fail \"$FAILS\"."; exit 1; }
          fi
          echo "Gate behaved as expected for ${{ matrix.variant }}."

  # Every push to main that passes every check above publishes the version named by
  # the newest CHANGELOG.md heading, once. Sites pin these tags, so a release never
  # tags a red commit. Pull requests and other branches never release.
  release:
    name: release
    needs: [self-test, fixture]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release named in CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh
