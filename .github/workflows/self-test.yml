# Every change to Ship Gate must prove the guards and config rules still bite
# before any site adopts the new version.
name: Self-test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    name: self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ShellCheck
        run: shellcheck -S error scripts/*.sh
      - name: Guards and config rules
        run: bash scripts/self-test.sh
