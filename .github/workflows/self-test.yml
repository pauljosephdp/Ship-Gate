# Every change to Ship Gate must prove the guards and config rules still bite
# before any site adopts the new version.
name: Self-test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pull requests cancel their own older runs. Pushes to main never cancel each other:
# each one may carry a release.
concurrency:
  group: self-test-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    name: self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      fixtures: ${{ steps.scope.outputs.fixtures }}
      proven: ${{ steps.scope.outputs.proven }}
      release: ${{ steps.release.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: README is current
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/check-readme.sh $BASE
      - name: ShellCheck
        run: shellcheck -S error scripts/*.sh test/*.sh
      - name: Guards and config rules
        run: bash scripts/self-test.sh
      # The fixture jobs are the expensive part. They exercise the verify action only, so
      # they run when a change touches it: action.yml, scripts/ (not the self-test,
      # release, README and post-deploy-only scripts), e2e/, tools/, test/, the
      # Playwright and Lighthouse configs, or this workflow.
      # - Pull requests skip them while in draft, and when the change touches none of
      #   those (docs, post-deploy/, templates/).
      # - A push to main skips them when a pull request run already passed every
      #   fixture job on this exact tree (the squash of an up-to-date PR), or when it
      #   touches none of those files since the previous main commit. If main moved
      #   since, the tree differs and everything runs. The release still needs this job.
      # - Manual runs always run everything.
      - name: Decide whether the fixture jobs run
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true proven=false
          # True when the files changed since $1 include any the fixture jobs exercise.
          touches_fixtures() {
            git diff --name-only "$1" HEAD \
              | grep -E '^(action\.yml|scripts/|e2e/|tools/|test/|playwright\.config\.ts|lighthouserc|\.github/workflows/self-test\.yml)' \
              | grep -vE '^scripts/(self-test\.sh|release\.sh|check-readme\.sh|check(-[a-z]+)*-live\.mjs)$' \
              | grep -q .
          }
          if [ "$EVENT" = pull_request ]; then
            if [ "$DRAFT" = true ]; then
              run=false; echo "Draft pull request: fixture jobs skipped until it is ready for review."
            elif ! touches_fixtures "$BASE"; then
              run=false; echo "No change to what the fixture jobs exercise: fixture jobs skipped."
            fi
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
            && ! touches_fixtures "$BEFORE"; then
            run=false proven=true; echo "No change to what the fixture jobs exercise since $BEFORE: fixture jobs skipped."
          elif [ "$EVENT" = push ]; then
            tree="$(git rev-parse 'HEAD^{tree}')" found=0
            for group in browser scans; do
              n="$(gh api "repos/$REPO/actions/artifacts?name=fixtures-passed-$tree-$group&per_page=100" \
                --jq '[.artifacts[] | select(.expired | not)] | length' 2>/dev/null || echo 0)"
              if [ "${n:-0}" -gt 0 ]; then found=$((found + 1)); fi
            done
            if [ "$found" -eq 2 ]; then
              run=false proven=true; echo "Tree $tree already passed every fixture job on its pull request: fixture jobs skipped."
            fi
          fi
          echo "fixtures=$run" >> "$GITHUB_OUTPUT"
          echo "proven=$proven" >> "$GITHUB_OUTPUT"
      # The release job starts a runner only when CHANGELOG.md names a version that
      # has no GitHub release yet. If the check itself cannot tell, the release job
      # runs and reports why.
      - name: Decide whether the release job runs
        id: release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          needed=true
          if out="$(DRY_RUN=1 bash scripts/release.sh)"; then
            version="$(sed -n 's/^version=//p' <<<"$out" | head -1)"
            if [ -z "$version" ]; then
              needed=false; echo "$out"
            elif gh release view "$version" >/dev/null 2>&1; then
              needed=false; echo "$version is already released: release job skipped."
            else
              echo "$version has no release yet: the release job publishes it."
            fi
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

  # The whole action, end to end, against a tiny conforming site, then against
  # copies broken one way each (test/break-fixture.sh). The conforming run must pass;
  # every broken run must fail on the check that owns the fault (test/expect-gate.sh).
  # Each variant stops at the stage that owns its fault (expect-gate.sh --stage):
  # scan faults never start a browser, browser faults skip Lighthouse, and only the
  # conforming run does everything. Variants share a job, so the runner setup, npm
  # cache and Playwright browser are paid once per job.
  fixture:
    name: fixture (${{ matrix.group }})
    needs: self-test
    if: needs.self-test.outputs.fixtures == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: browser, v1: conforming, v2: vendor-named-asset, v3: missing-alt, v4: wide-element, v5: csp-violation, v6: bad-redirect, v7: no-focus-ring, v8: tracker-cookie, v9: posthog-hybrid }
          - { group: scans, v1: two-h1, v2: direct-tag, v3: blocks-ai-search, v4: bad-jsonld, v5: robots-no-agents, v6: rtl-no-dir, v7: google-font, v8: allows-training, v9: posthog-hybrid-missing, v10: posthog-hybrid-csp }
    steps:
      - uses: actions/checkout@v4
      - name: Break the fixture (1)
        if: ${{ !cancelled() && matrix.v1 }}
        run: |
          bash test/break-fixture.sh ${{ matrix.v1 }}
          echo "SHIP_GATE_FIXTURE_STAGE=$(bash test/expect-gate.sh --stage ${{ matrix.v1 }})" >> "$GITHUB_ENV"
      - name: Ship Gate (1)
        id: gate1
        if: ${{ !cancelled() && matrix.v1 }}
        continue-on-error: true
        uses: ./
        with:
          working-directory: test/fixture-site
          stage: ${{ env.SHIP_GATE_FIXTURE_STAGE }}
      - name: Expected result (1)
        if: ${{ !cancelled() && matrix.v1 }}
        run: bash test/expect-gate.sh ${{ matrix.v1 }} ${{ steps.gate1.outcome }}
      - name: Break the fixture (2)
        if: ${{ !cancelled() && matrix.v2 }}
        run: |
          bash test/break-fixture.sh ${{ matrix.v2 }}
          echo "SHIP_GATE_FIXTURE_STAGE=$(bash test/expect-gate.sh --stage ${{ matrix.v2 }})" >> "$GITHUB_ENV"
      - name: Ship Gate (2)
        id: gate2
        if: ${{ !cancelled() && matrix.v2 }}
        continue-on-error: true
        uses: ./
        with:
          working-directory: test/fixture-site
          stage: ${{ env.SHIP_GATE_FIXTURE_STAGE }}
      - name: Expected result (2)
        if: ${{ !cancelled() && matrix.v2 }}
        run: bash test/expect-gate.sh ${{ matrix.v2 }} ${{ steps.gate2.outcome }}
      - name: Break the fixture (3)
        if: ${{ !cancelled() && matrix.v3 }}
        run: |
          bash test/break-fixture.sh ${{ matrix.v3 }}
          echo "SHIP_GATE_FIXTURE_STAGE=$(bash test/expect-gate.sh --stage ${{ matrix.v3 }})" >> "$GITHUB_ENV"
      - name: Ship Gate (3)
        id: gate3
        if: ${{ !cancelled() && matrix.v3 }}
        continue-on-error: true
        uses: ./
        with:
          working-directory: test/fixture-site
          stage: ${{ env.SHIP_GATE_FIXTURE_STAGE }}
      - name: Expected result (3)
        if: ${{ !cancelled() && matrix.v3 }}
        run: bash test/expect-gate.sh ${{ matrix.v3 }} ${{ steps.gate3.outcome }}
      - name: Break the fixture (4)
        if: ${{ !cancelled() && matrix.v4 }}
        run: |
          bash test/break-fixture.sh ${{ matrix.v4 }}
          echo "SHIP_GATE_FIXTURE_STAGE=$(bash test/expect-gate.sh --stage ${{ matrix.v4 }})" >> "$GITHUB_ENV"
      - name: Ship Gate (4)
        id: gate4
        if: ${{ !cancelled() && matrix.v4 }}
        continue-on-error: true
        uses: ./
        with:
          working-directory: test/fixture-site
          stage: ${{ env.SHIP_GATE_FIXTURE_STAGE }}
      - name: Expected result (4)
        if: ${{ !cancelled() && matrix.v4 }}
        run: bash test/expect-gate.sh ${{ matrix.v4 }} ${{ steps.gate4.outcome }}
      - name: Break the fixture (5)
        if: ${{ !cancelled() && matrix.v5 }}
        run: |
          bash test/break-fixture.sh ${{ matrix.v5 }}
          echo "SHIP_GATE_FIXTURE_STAGE=$(bash test/expect-gate.sh --stage ${{ matrix.v5 }})" >> "$GITHUB_ENV"
      - name: Ship Gate (5)
        id: gate5
        if: ${{ !cancelled() && matrix.v5 }}
        continue-on-error: true
        uses: ./
        with:
          working-directory: test/fixture-site
          stage: ${{ env.SHIP_GATE_FIXTURE_STAGE }}
      - name: Expected result (5)
        if: ${{ !cancelled() && matrix.v5 }}
        run: bash test/expect-gate.sh ${{ matrix.v5 }} ${{ steps.gate5.outcome }}
      - name: Break the fixture (6)
        if: ${{ !cancelled() && matrix.v6 }}
        run: |
          bash test/break-fixture.sh ${{ matrix.v6 }}
          echo "SHIP_GATE_FIXTURE_STAGE=$(bash test/expect-gate.sh --stage ${{ matrix.v6 }})" >> "$GITHUB_ENV"
      - name: Ship Gate (6)
        id: gate6
        if: ${{ !cancelled() && matrix.v6 }}
        continue-on-error: true
        uses: ./
        with:
          working-directory: test/fixture-site
          stage: ${{ env.SHIP_GATE_FIXTURE_STAGE }}
      - name: Expected result (6)
        if: ${{ !cancelled() && matrix.v6 }}
        run: bash test/expect-gate.sh ${{ matrix.v6 }} ${{ steps.gate6.outcome }}
      - name: Break the fixture (7)
        if: ${{ !cancelled() && matrix.v7 }}
        run: |
          bash test/break-fixture.sh ${{ matrix.v7 }}
          echo "SHIP_GATE_FIXTURE_STAGE=$(bash test/expect-gate.sh --stage ${{ matrix.v7 }})" >> "$GITHUB_ENV"
      - name: Ship Gate (7)
        id: gate7
        if: ${{ !cancelled() && matrix.v7 }}
        continue-on-error: true
        uses: ./
        with:
          working-directory: test/fixture-site
          stage: ${{ env.SHIP_GATE_FIXTURE_STAGE }}
      - name: Expected result (7)
        if: ${{ !cancelled() && matrix.v7 }}
        run: bash test/expect-gate.sh ${{ matrix.v7 }} ${{ steps.gate7.outcome }}
      - name: Break the fixture (8)
        if: ${{ !cancelled() && matrix.v8 }}
        run: |
          bash test/break-fixture.sh ${{ matrix.v8 }}
          echo "SHIP_GATE_FIXTURE_STAGE=$(bash test/expect-gate.sh --stage ${{ matrix.v8 }})" >> "$GITHUB_ENV"
      - name: Ship Gate (8)
        id: gate8
        if: ${{ !cancelled() && matrix.v8 }}
        continue-on-error: true
        uses: ./
        with:
          working-directory: test/fixture-site
          stage: ${{ env.SHIP_GATE_FIXTURE_STAGE }}
      - name: Expected result (8)
        if: ${{ !cancelled() && matrix.v8 }}
        run: bash test/expect-gate.sh ${{ matrix.v8 }} ${{ steps.gate8.outcome }}
      - name: Break the fixture (9)
        if: ${{ !cancelled() && matrix.v9 }}
        run: |
          bash test/break-fixture.sh ${{ matrix.v9 }}
          echo "SHIP_GATE_FIXTURE_STAGE=$(bash test/expect-gate.sh --stage ${{ matrix.v9 }})" >> "$GITHUB_ENV"
      - name: Ship Gate (9)
        id: gate9
        if: ${{ !cancelled() && matrix.v9 }}
        continue-on-error: true
        uses: ./
        with:
          working-directory: test/fixture-site
          stage: ${{ env.SHIP_GATE_FIXTURE_STAGE }}
      - name: Expected result (9)
        if: ${{ !cancelled() && matrix.v9 }}
        run: bash test/expect-gate.sh ${{ matrix.v9 }} ${{ steps.gate9.outcome }}
      - name: Break the fixture (10)
        if: ${{ !cancelled() && matrix.v10 }}
        run: |
          bash test/break-fixture.sh ${{ matrix.v10 }}
          echo "SHIP_GATE_FIXTURE_STAGE=$(bash test/expect-gate.sh --stage ${{ matrix.v10 }})" >> "$GITHUB_ENV"
      - name: Ship Gate (10)
        id: gate10
        if: ${{ !cancelled() && matrix.v10 }}
        continue-on-error: true
        uses: ./
        with:
          working-directory: test/fixture-site
          stage: ${{ env.SHIP_GATE_FIXTURE_STAGE }}
      - name: Expected result (10)
        if: ${{ !cancelled() && matrix.v10 }}
        run: bash test/expect-gate.sh ${{ matrix.v10 }} ${{ steps.gate10.outcome }}
      # Lets the push to main skip this group when it lands the exact tree tested here.
      - name: Record the tree that passed
        id: passed
        if: success() && github.event_name == 'pull_request'
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "$tree" > "$RUNNER_TEMP/fixtures-passed.txt"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.passed.outcome == 'success'
        with:
          name: fixtures-passed-${{ steps.passed.outputs.tree }}-${{ matrix.group }}
          path: ${{ runner.temp }}/fixtures-passed.txt
          retention-days: 7

  # Every push to main that passes every check above publishes the version named by
  # the newest CHANGELOG.md heading, once. Sites pin these tags, so a release never
  # tags a red commit. A manual run on main re-runs every check, then releases.
  # Pull requests and other branches never release, and neither does a push whose
  # newest CHANGELOG.md version is already released. The fixture jobs count as passed
  # when self-test proved this exact tree passed them on its pull request.
  release:
    name: release
    needs: [self-test, fixture]
    if: >-
      !cancelled()
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
      && needs.self-test.result == 'success'
      && needs.self-test.outputs.release == 'true'
      && (needs.fixture.result == 'success'
          || (needs.fixture.result == 'skipped' && needs.self-test.outputs.proven == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release named in CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh
