name: Ship Gate — verify
description: >
  Merge gate for Astro sites. Stack guards, contract check, astro check, unit
  tests, the site's own checks, build, post-build scans, SEO/AEO/GEO/AIO
  discovery readiness, Playwright + axe, keyboard, reflow, CSP, edge files and
  Lighthouse CI. Every check runs; one summary at the end says which failed.
  Run it as the only step after checkout in a job named "verify".
author: Ship Gate
inputs:
  working-directory:
    description: The site's directory inside the repo, e.g. "site". Defaults to the repo root.
    default: "."
  config:
    description: Path to the site's Ship Gate config, relative to working-directory.
    default: ship-gate.config.json
  stage:
    description: >
      How far the gate runs. "full" (default) runs every check. "browser" skips
      Lighthouse. "scans" stops after the post-build scans, with no browser. The
      caller template passes "scans" for draft pull requests; a draft can't merge,
      and marking it ready runs the full gate.
    default: full
  skip-fast:
    description: >
      "true" skips the generic checks that Ship Gate's fast stage already ran on
      the same commit inside Cloudflare Workers Builds (astro check, lint, unit
      tests and the post-build scans), keeping contract, guards, the site's own
      checks, build, the browser suite and Lighthouse. Only safe when the site's
      ruleset requires the "Workers Builds" check and SHIP_GATE_REQUIRE_FAST=1 is
      set in Workers Builds, so a green build always means the fast stage ran.
    default: "false"
  lighthouse-runs:
    description: >
      Lighthouse runs per URL (1-5). Empty keeps the default: 3 for a page list,
      1 for "all". Performance only warns, and the other categories are
      deterministic, so the caller template passes 1 on pull requests.
    default: ""
runs:
  using: composite
  steps:
    - name: Locate the site and its pinned Node
      id: site
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        STAGE: ${{ inputs.stage }}
      run: |
        stage=$STAGE fixture=false reuse=false
        case "$stage" in full|browser|scans) ;; *) echo "::error::Unknown stage \"$stage\": use full, browser or scans."; exit 1 ;; esac
        # Ship Gate's own fixture tests (uses: ./ in this repo, SHIP_GATE_FIXTURE_STAGE set).
        # Compare resolved paths: for uses: ./ the runner sets GITHUB_ACTION_PATH to "<workspace>/./".
        if [ -n "${SHIP_GATE_FIXTURE_STAGE:-}" ] \
          && [ "$(cd "$GITHUB_ACTION_PATH" && pwd -P)" = "$(cd "$GITHUB_WORKSPACE" && pwd -P)" ]; then
          fixture=true
          # A later variant in the same job reuses the installs of the first
          # (test/break-fixture.sh keeps node_modules; the lockfiles never change).
          if [ -d node_modules ]; then reuse=true; fi
        fi
        echo "Ship Gate stage: $stage (fixture: $fixture, reuse installs: $reuse)"
        { echo "stage=$stage"; echo "fixture=$fixture"; echo "reuse=$reuse"; } >> "$GITHUB_OUTPUT"
        for f in .nvmrc .node-version; do
          if [ -f "$f" ]; then echo "node-version-file=${{ inputs.working-directory }}/$f" >> "$GITHUB_OUTPUT"; exit 0; fi
        done
        echo "::error::No .nvmrc or .node-version in ${{ inputs.working-directory }} — pin Node 22.12.0 or later."
        exit 1

    - uses: actions/setup-node@v7
      with:
        node-version-file: ${{ steps.site.outputs.node-version-file }}
        cache: ${{ steps.site.outputs.reuse != 'true' && 'npm' || '' }}
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    # From here on every check runs even after one fails (continue-on-error), so a PR
    # shows all its failures at once. The Result step at the end fails the job.
    - name: Contract and config
      id: prepare
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/scripts/prepare.mjs" verify "${{ inputs.config }}"

    - name: Stack guards
      id: guards
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bash "$GITHUB_ACTION_PATH/scripts/guards.sh"

    - uses: actions/setup-python@v7
      if: env.SHIP_GATE_PYTHON != ''
      with:
        python-version: ${{ env.SHIP_GATE_PYTHON }}

    - name: Python package cache key
      id: pip
      if: env.SHIP_GATE_PIP != ''
      shell: bash
      run: echo "key=$(python -c 'import sys; print(sys.version.split()[0])')-$(printf '%s' "$SHIP_GATE_PIP" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v6
      if: env.SHIP_GATE_PIP != ''
      with:
        path: ~/.cache/pip
        key: ship-gate-pip-${{ runner.os }}-${{ runner.arch }}-${{ steps.pip.outputs.key }}

    - name: Python packages for site checks
      if: env.SHIP_GATE_PIP != ''
      shell: bash
      run: python -m pip install --quiet $SHIP_GATE_PIP

    - name: Install
      id: install
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REUSE: ${{ steps.site.outputs.reuse }}
      run: |
        if [ "$REUSE" = true ]; then echo "Fixture mode: reusing node_modules from the previous variant."; exit 0; fi
        npm ci

    # Astro keeps its optimised images in node_modules/.astro (Workers Builds' build cache keeps the same
    # directory). Restored after npm ci, which wipes node_modules, so the build re-encodes only new or changed
    # images instead of every image on every run. A pull request also reads the cache saved on main by the
    # monthly full sweep; restores keep it alive past GitHub's 7-day idle eviction. Output is unchanged: Astro
    # keys each cached image by its source and transform.
    - uses: actions/cache@v6
      with:
        path: ${{ inputs.working-directory }}/node_modules/.astro
        key: ship-gate-astro-${{ runner.os }}-${{ hashFiles(format('{0}/src/**/*.jpg', inputs.working-directory), format('{0}/src/**/*.jpeg', inputs.working-directory), format('{0}/src/**/*.png', inputs.working-directory), format('{0}/src/**/*.webp', inputs.working-directory), format('{0}/src/**/*.avif', inputs.working-directory), format('{0}/src/**/*.gif', inputs.working-directory), format('{0}/src/**/*.tiff', inputs.working-directory), format('{0}/package-lock.json', inputs.working-directory)) }}
        restore-keys: ship-gate-astro-${{ runner.os }}-

    - name: astro check
      id: check
      if: inputs.skip-fast != 'true'
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm run check

    - name: Lint
      id: lint
      if: inputs.skip-fast != 'true' && (env.SHIP_GATE_HAS_LINT != '')
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm run lint

    - name: Unit tests
      id: test
      if: inputs.skip-fast != 'true' && (env.SHIP_GATE_HAS_TEST != '')
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm test

    - name: Site checks (before build)
      id: prebuild
      if: env.SHIP_GATE_CHECKS_PREBUILD != ''
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run-checks.sh" $SHIP_GATE_CHECKS_PREBUILD

    - name: Build
      id: build
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm run build

    # Everything below needs a build and a valid config.
    - name: Resolve pages and write test config
      id: afterbuild
      if: steps.build.outcome == 'success' && steps.prepare.outcome == 'success'
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SHIP_GATE_LIGHTHOUSE_RUNS: ${{ inputs.lighthouse-runs }}
      run: node "$GITHUB_ACTION_PATH/scripts/prepare.mjs" after-build "${{ inputs.config }}"

    - name: Client bundle is PostHog-free
      id: dist
      if: inputs.skip-fast != 'true' && (steps.build.outcome == 'success' && contains(format(' {0} ', env.SHIP_GATE_POLICIES), ' posthog-server-only '))
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bash "$GITHUB_ACTION_PATH/scripts/check-dist.sh"

    - name: PostHog on every page (posthog-hybrid)
      id: posthog
      if: inputs.skip-fast != 'true' && (steps.afterbuild.outcome == 'success' && contains(format(' {0} ', env.SHIP_GATE_POLICIES), ' posthog-hybrid '))
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/scripts/check-posthog.mjs"

    - name: Structure scan
      id: structure
      if: inputs.skip-fast != 'true' && (steps.afterbuild.outcome == 'success')
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/scripts/check-structure.mjs"

    - name: Discovery scan (SEO, AEO, GEO, AIO)
      id: discovery
      if: inputs.skip-fast != 'true' && (steps.afterbuild.outcome == 'success')
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/scripts/check-discovery.mjs"

    - name: Placeholder copy scan
      id: copy
      if: inputs.skip-fast != 'true' && (steps.afterbuild.outcome == 'success')
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/scripts/check-copy.mjs"

    - name: Market scan (market-cn, rtl-logical-css)
      id: market
      if: inputs.skip-fast != 'true' && (steps.afterbuild.outcome == 'success' && (contains(format(' {0} ', env.SHIP_GATE_POLICIES), ' market-cn ') || contains(format(' {0} ', env.SHIP_GATE_POLICIES), ' rtl-logical-css ')))
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/scripts/check-market.mjs"

    - name: Site checks (after build)
      id: postbuild
      if: steps.build.outcome == 'success' && env.SHIP_GATE_CHECKS_POSTBUILD != ''
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run-checks.sh" $SHIP_GATE_CHECKS_POSTBUILD

    # The Playwright browser download is the slowest install; cache it per Playwright version.
    - name: Playwright version
      id: pw
      if: steps.afterbuild.outcome == 'success' && steps.site.outputs.stage != 'scans'
      shell: bash
      run: echo "version=$(node -p "require(process.argv[1]).packages['node_modules/playwright-core']?.version ?? ''" "$SHIP_GATE_DIR/package-lock.json")" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v6
      if: steps.pw.outcome == 'success' && steps.pw.outputs.version != '' && steps.site.outputs.reuse != 'true'
      with:
        path: ~/.cache/ms-playwright
        key: ship-gate-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}

    - name: Install Ship Gate test tools
      id: tools
      if: steps.afterbuild.outcome == 'success' && steps.site.outputs.stage != 'scans'
      shell: bash
      env:
        REUSE: ${{ steps.site.outputs.reuse }}
      run: |
        cd "$SHIP_GATE_DIR"
        if [ "$REUSE" = true ] && [ -x node_modules/.bin/playwright ]; then
          echo "Fixture mode: reusing the test tools from the previous variant."
        else
          npm ci --no-audit --no-fund --loglevel=error
        fi
        # System packages once per runner: apt-get is slow and a second run in one job gains nothing.
        if [ -f "$RUNNER_TEMP/.ship-gate-pw-deps" ]; then
          npx --no-install playwright install chromium
        else
          npx --no-install playwright install --with-deps chromium
          touch "$RUNNER_TEMP/.ship-gate-pw-deps"
        fi

    # Site browser checks use the site's own Playwright, whose browser build may differ.
    - name: Site checks (browser, against the served build)
      id: browser
      if: steps.tools.outcome == 'success' && env.SHIP_GATE_CHECKS_BROWSER != ''
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # The tools step already installed the system packages on this runner.
        if [ -f "$RUNNER_TEMP/.ship-gate-pw-deps" ]; then
          npx --no-install playwright install chromium
        else
          npx --no-install playwright install --with-deps chromium
        fi
        bash "$GITHUB_ACTION_PATH/scripts/run-checks.sh" --serve $SHIP_GATE_CHECKS_BROWSER

    - name: Smoke, axe (WCAG 2.2 AA), keyboard, reflow, CSP, consent and edge files
      id: e2e
      if: steps.tools.outcome == 'success'
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: '"$SHIP_GATE_DIR/node_modules/.bin/playwright" test -c "$SHIP_GATE_DIR/playwright.config.ts"'

    - name: Lighthouse CI
      id: lighthouse
      if: steps.tools.outcome == 'success' && steps.site.outputs.stage == 'full'
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: '"$SHIP_GATE_DIR/node_modules/.bin/lhci" autorun --config="$SHIP_GATE_DIR/lighthouserc.json"'

    - name: Summary
      id: summary
      if: always()
      shell: bash
      env:
        STAGE: ${{ steps.site.outputs.stage }}
        SKIP_FAST: ${{ inputs.skip-fast }}
        OUTCOMES: >-
          Node version pinned=${{ steps.site.outcome }}
          |Contract and config=${{ steps.prepare.outcome }}
          |Install=${{ steps.install.outcome }}
          |Stack guards=${{ steps.guards.outcome }}
          |astro check=${{ steps.check.outcome }}
          |Lint=${{ steps.lint.outcome }}
          |Unit tests=${{ steps.test.outcome }}
          |Site checks before build=${{ steps.prebuild.outcome }}
          |Build=${{ steps.build.outcome }}
          |Page resolution=${{ steps.afterbuild.outcome }}
          |Client bundle PostHog-free=${{ steps.dist.outcome }}
          |PostHog on every page=${{ steps.posthog.outcome }}
          |Structure scan=${{ steps.structure.outcome }}
          |Discovery (SEO, AEO, GEO, AIO)=${{ steps.discovery.outcome }}
          |Placeholder copy=${{ steps.copy.outcome }}
          |Market scan=${{ steps.market.outcome }}
          |Site checks after build=${{ steps.postbuild.outcome }}
          |Ship Gate test tools=${{ steps.tools.outcome }}
          |Site browser checks=${{ steps.browser.outcome }}
          |Smoke, axe, reflow, CSP, edge=${{ steps.e2e.outcome }}
          |Lighthouse=${{ steps.lighthouse.outcome }}
      run: |
        failed=0
        table="| Check | Result |"$'\n'"|---|---|"
        IFS='|' read -ra rows <<< "$OUTCOMES"
        for row in "${rows[@]}"; do
          name="$(echo "${row%%=*}" | xargs)"; outcome="$(echo "${row##*=}" | xargs)"
          case "$outcome" in
            success) mark="✅ passed" ;;
            failure) mark="❌ failed"; failed=1 ;;
            *) mark="➖ not run" ;;
          esac
          table+=$'\n'"| $name | $mark |"
        done
        note=""
        case "$STAGE" in
          scans) note=$'\n'"Stage \`scans\`: browser tests and Lighthouse run when the pull request is ready for review."$'\n' ;;
          browser) note=$'\n'"Stage \`browser\`: Lighthouse did not run."$'\n' ;;
        esac
        if [ "$SKIP_FAST" = true ]; then
          note+=$'\n'"\`skip-fast\`: astro check, lint, unit tests and the post-build scans ran in the Workers Builds fast stage for this commit (the required \"Workers Builds\" check), so they show as not run here."$'\n'
        fi
        printf '## Ship Gate\n%s\n%s\n' "$note" "$table" >> "$GITHUB_STEP_SUMMARY"
        echo "$table"
        # Machine-readable copy for callers (and Ship Gate's own fixture tests).
        echo "$table" > "${SHIP_GATE_DIR:-$RUNNER_TEMP}/summary.md"
        echo "failed=$failed" >> "$GITHUB_OUTPUT"

    # At most one run's reports per branch: a failed run's reports replace the branch's
    # older ones, and a green run clears them. Other branches' reports are left alone,
    # since someone may be reading one. Deleting needs `actions: write` (the caller
    # templates grant it); without it this logs a notice and the reports expire.
    - name: Prune older reports on this branch
      if: always() && steps.site.outputs.fixture != 'true'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
        RUN_ID: ${{ github.run_id }}
      run: |
        ids="$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" --jq '.artifacts[]
          | select((.expired | not) and (.name | startswith("ship-gate-reports-")))
          | select(.workflow_run.head_branch == env.BRANCH and (.workflow_run.id | tostring) != env.RUN_ID)
          | .id')" || { echo "::notice::Could not list artifacts; older reports stay until they expire."; exit 0; }
        n=0
        for id in $ids; do
          if gh api -X DELETE "repos/$REPO/actions/artifacts/$id" >/dev/null 2>&1; then n=$((n + 1))
          else echo "::notice::Could not delete older reports (the workflow needs actions: write); they expire after 5 days."; break; fi
        done
        echo "Deleted $n older report artifact(s) from $BRANCH."

    # Reports (Playwright traces, Lighthouse HTML) only when a check failed: that is when
    # someone reads them. Kept on every green run, they filled the artifact storage quota.
    # Ship Gate's own fixture runs fail on purpose and print the summary instead.
    # Artifact names must be unique per run; matrix jobs share github.job.
    - name: Name the reports
      id: reports
      if: always() && env.SHIP_GATE_DIR != '' && steps.summary.outputs.failed == '1' && steps.site.outputs.fixture != 'true'
      shell: bash
      run: echo "name=ship-gate-reports-${{ github.job }}-${{ github.run_attempt }}-$(date +%s%N | tail -c 7)" >> "$GITHUB_OUTPUT"

    - name: Upload reports
      if: always() && steps.reports.outcome == 'success'
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.reports.outputs.name }}
        path: ${{ env.SHIP_GATE_DIR }}/reports/
        retention-days: 5
        if-no-files-found: ignore

    - name: Result
      if: always()
      shell: bash
      env:
        FAILED: ${{ steps.summary.outputs.failed }}
      run: |
        if [ "$FAILED" != 0 ]; then echo "::error::Ship Gate failed — see the summary table and each step's log."; exit 1; fi
        echo "Ship Gate passed."

