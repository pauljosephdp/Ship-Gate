name: Ship Gate — verify
description: >
  Gallivant portfolio merge gate. Stack guards, contract check, astro check,
  unit tests, the site's own checks, build, post-build scans, Playwright + axe,
  reflow, CSP, edge files and Lighthouse CI. Every check runs; one summary at
  the end says which failed. Run it as the only step after checkout in a job
  named "verify".
author: Gallivant Ventures
inputs:
  working-directory:
    description: The site's directory inside the repo, e.g. "site". Defaults to the repo root.
    default: "."
  config:
    description: Path to the site's Ship Gate config, relative to working-directory.
    default: ship-gate.config.json
runs:
  using: composite
  steps:
    - name: Locate the site and its pinned Node
      id: site
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        for f in .nvmrc .node-version; do
          if [ -f "$f" ]; then echo "node-version-file=${{ inputs.working-directory }}/$f" >> "$GITHUB_OUTPUT"; exit 0; fi
        done
        echo "::error::No .nvmrc or .node-version in ${{ inputs.working-directory }} — pin Node 22.12.0 or later."
        exit 1

    - uses: actions/setup-node@v7
      with:
        node-version-file: ${{ steps.site.outputs.node-version-file }}
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    # From here on every check runs even after one fails (continue-on-error), so a PR
    # shows all its failures at once. The Summary step at the end fails the job.
    - name: Contract and config
      id: prepare
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/scripts/prepare.mjs" verify "${{ inputs.config }}"

    - name: Stack guards
      id: guards
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bash "$GITHUB_ACTION_PATH/scripts/guards.sh"

    - uses: actions/setup-python@v5
      if: env.SHIP_GATE_PYTHON != ''
      with:
        python-version: ${{ env.SHIP_GATE_PYTHON }}

    - name: Python packages for site checks
      if: env.SHIP_GATE_PIP != ''
      shell: bash
      run: python -m pip install --quiet $SHIP_GATE_PIP

    - name: Install
      id: install
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    - name: astro check
      id: check
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm run check

    - name: Lint
      id: lint
      if: env.SHIP_GATE_HAS_LINT != ''
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm run lint

    - name: Unit tests
      id: test
      if: env.SHIP_GATE_HAS_TEST != ''
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm test

    - name: Site checks (before build)
      id: prebuild
      if: env.SHIP_GATE_CHECKS_PREBUILD != ''
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run-checks.sh" $SHIP_GATE_CHECKS_PREBUILD

    - name: Build
      id: build
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm run build

    # Everything below needs a build and a valid config.
    - name: Resolve pages and write test config
      id: afterbuild
      if: steps.build.outcome == 'success' && steps.prepare.outcome == 'success'
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/scripts/prepare.mjs" after-build "${{ inputs.config }}"

    - name: Client bundle is PostHog-free
      id: dist
      if: steps.build.outcome == 'success'
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bash "$GITHUB_ACTION_PATH/scripts/check-dist.sh"

    - name: Structure scan
      id: structure
      if: steps.afterbuild.outcome == 'success'
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/scripts/check-structure.mjs"

    - name: Placeholder copy scan
      id: copy
      if: steps.afterbuild.outcome == 'success'
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/scripts/check-copy.mjs"

    - name: Site checks (after build)
      id: postbuild
      if: steps.build.outcome == 'success' && env.SHIP_GATE_CHECKS_POSTBUILD != ''
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run-checks.sh" $SHIP_GATE_CHECKS_POSTBUILD

    - name: Install Ship Gate test tools
      id: tools
      if: steps.afterbuild.outcome == 'success'
      shell: bash
      run: |
        cd "$SHIP_GATE_DIR"
        npm ci --no-audit --no-fund --loglevel=error
        npx --no-install playwright install --with-deps chromium

    # Site browser checks use the site's own Playwright, whose browser build may differ.
    - name: Site checks (browser, against the served build)
      id: browser
      if: steps.tools.outcome == 'success' && env.SHIP_GATE_CHECKS_BROWSER != ''
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        npx --no-install playwright install --with-deps chromium
        bash "$GITHUB_ACTION_PATH/scripts/run-checks.sh" --serve $SHIP_GATE_CHECKS_BROWSER

    - name: Smoke, axe (WCAG 2.2 AA), reflow, CSP and edge files
      id: e2e
      if: steps.tools.outcome == 'success'
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: '"$SHIP_GATE_DIR/node_modules/.bin/playwright" test -c "$SHIP_GATE_DIR/playwright.config.ts"'

    - name: Lighthouse CI
      id: lighthouse
      if: steps.tools.outcome == 'success'
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: '"$SHIP_GATE_DIR/node_modules/.bin/lhci" autorun --config="$SHIP_GATE_DIR/lighthouserc.json"'

    # Artifact names must be unique per run; matrix jobs share github.job.
    - name: Name the reports
      id: reports
      if: always() && env.SHIP_GATE_DIR != ''
      shell: bash
      run: echo "name=ship-gate-reports-${{ github.job }}-${{ github.run_attempt }}-$(date +%s%N | tail -c 7)" >> "$GITHUB_OUTPUT"

    - name: Upload reports
      if: always() && env.SHIP_GATE_DIR != ''
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.reports.outputs.name }}
        path: ${{ env.SHIP_GATE_DIR }}/reports/
        retention-days: 14
        if-no-files-found: ignore

    - name: Summary
      if: always()
      shell: bash
      env:
        OUTCOMES: >-
          Contract and config=${{ steps.prepare.outcome }}
          |Install=${{ steps.install.outcome }}
          |Stack guards=${{ steps.guards.outcome }}
          |astro check=${{ steps.check.outcome }}
          |Lint=${{ steps.lint.outcome }}
          |Unit tests=${{ steps.test.outcome }}
          |Site checks before build=${{ steps.prebuild.outcome }}
          |Build=${{ steps.build.outcome }}
          |Page resolution=${{ steps.afterbuild.outcome }}
          |Client bundle PostHog-free=${{ steps.dist.outcome }}
          |Structure scan=${{ steps.structure.outcome }}
          |Placeholder copy=${{ steps.copy.outcome }}
          |Site checks after build=${{ steps.postbuild.outcome }}
          |Site browser checks=${{ steps.browser.outcome }}
          |Smoke, axe, reflow, CSP, edge=${{ steps.e2e.outcome }}
          |Lighthouse=${{ steps.lighthouse.outcome }}
      run: |
        failed=0
        table="| Check | Result |"$'\n'"|---|---|"
        IFS='|' read -ra rows <<< "$OUTCOMES"
        for row in "${rows[@]}"; do
          name="$(echo "${row%%=*}" | xargs)"; outcome="$(echo "${row##*=}" | xargs)"
          case "$outcome" in
            success) mark="✅ passed" ;;
            failure) mark="❌ failed"; failed=1 ;;
            *) mark="➖ not run" ;;
          esac
          table+=$'\n'"| $name | $mark |"
        done
        printf '## Ship Gate\n\n%s\n' "$table" >> "$GITHUB_STEP_SUMMARY"
        echo "$table"
        # Machine-readable copy for callers (and Ship Gate's own fixture tests).
        echo "$table" > "${SHIP_GATE_DIR:-$RUNNER_TEMP}/summary.md"
        if [ "$failed" -ne 0 ]; then echo "::error::Ship Gate failed — see the table above and each step's log."; exit 1; fi
        echo "Ship Gate passed."
