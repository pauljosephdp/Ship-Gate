name: Ship Gate — CI health
description: >
  Control bands over a workflow's recent runs (duration and failure rate). Detection is
  deterministic (scripts/ci-health.mjs). Tier 2 asks Claude to diagnose, read-only, into the job
  summary; tier 3 (a 3σ breach or a run near the timeout) also opens or updates one issue,
  written as an intent.md, for the owner to triage. Needs actions: read and issues: write.
author: Ship Gate
inputs:
  workflow:
    description: The workflow file to watch, e.g. ci.yml.
    default: ci.yml
  timeout-minutes:
    description: That workflow's job timeout, in minutes.
    default: "30"
  anthropic-api-key:
    description: For the tier 2 and 3 diagnosis. Empty skips the diagnosis; the bands still run.
    default: ""
  claude-code-version:
    description: The Claude Code CLI version for the diagnosis.
    default: 2.1.293
runs:
  using: composite
  steps:
    - name: Recent runs
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        WORKFLOW: ${{ inputs.workflow }}
      run: |
        gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/runs?status=completed&per_page=30" > "$RUNNER_TEMP/runs.json"

    - name: Control bands
      id: bands
      shell: bash
      env:
        TIMEOUT: ${{ inputs.timeout-minutes }}
      run: |
        node "$GITHUB_ACTION_PATH/../scripts/ci-health.mjs" "$RUNNER_TEMP/runs.json" --timeout "$TIMEOUT" | tee "$RUNNER_TEMP/bands.json"
        { echo "## CI health: ${{ inputs.workflow }}"; echo; echo '```json'; cat "$RUNNER_TEMP/bands.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

    - name: Diagnose (Claude, read-only)
      id: diagnose
      if: steps.bands.outputs.tier >= 2 && inputs.anthropic-api-key != ''
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.claude-code-version }}
        WORKFLOW: ${{ inputs.workflow }}
      run: |
        npm install -g --no-audit --no-fund --loglevel=error "@anthropic-ai/claude-code@$VERSION"
        claude -p "The CI health check for $WORKFLOW in $GITHUB_REPOSITORY breached its control band. The band result is in $RUNNER_TEMP/bands.json. Diagnose why: compare the latest runs' step timings and failures with earlier runs (gh run view <id> --json jobs, gh run view <id> --log-failed), and read the workflow and the code it runs. Do not change anything. Write your finding as an intent.md in this exact shape: '# Intent: <short name>', 'Author: CI health (Claude). Status: draft.', then sections '## Problem' (the anomaly and its evidence: run links, minutes, failing steps), '## Proposed outcome', '## Affected users and systems', '## Constraints', '## Open questions'. Output only the markdown." \
          --allowedTools "Read,Grep,Glob,Bash(gh run view:*),Bash(gh run list:*),Bash(gh api:*)" \
          --output-format text > "$RUNNER_TEMP/intent.md"
        { echo; echo "### Diagnosis"; echo; cat "$RUNNER_TEMP/intent.md"; } >> "$GITHUB_STEP_SUMMARY"

    - name: Open or update the CI health issue (tier 3)
      if: steps.bands.outputs.tier >= 3
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        WORKFLOW: ${{ inputs.workflow }}
      run: |
        title="CI health: $WORKFLOW breached its control band"
        body="$RUNNER_TEMP/issue.md"
        if [ -s "$RUNNER_TEMP/intent.md" ]; then cp "$RUNNER_TEMP/intent.md" "$body"
        else { echo "# Intent: $WORKFLOW is drifting"; echo "Author: CI health. Status: draft."; echo; echo "## Problem"; echo; echo '```json'; cat "$RUNNER_TEMP/bands.json"; echo '```'; echo; echo "## Proposed outcome"; echo; echo "Bring $WORKFLOW back inside its band. Add ANTHROPIC_API_KEY to get a diagnosis here."; } > "$body"; fi
        printf '\n---\nTriage: accept by committing this as docs/changes/<date>-<name>/intent.md, schedule, or close it (a close tunes the bands). Run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$body"
        n="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
        if [ -n "$n" ]; then gh issue comment "$n" --body-file "$body"; echo "Updated issue #$n."
        else gh issue create --title "$title" --body-file "$body"; fi
