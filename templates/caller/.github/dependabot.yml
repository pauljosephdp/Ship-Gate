version: 2
registries:
  # Ship-Gate is a private repo, so Dependabot needs a token to see its release tags
  # and raise the pin. SHIP_GATE_READ_TOKEN is a Dependabot secret (Settings → Secrets
  # and variables → Dependabot): a fine-grained token with read-only Contents on
  # pauljosephdp/Ship-Gate. Without it the github-actions update job fails with
  # "Repository not found" and the pin never moves.
  ship-gate:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.SHIP_GATE_READ_TOKEN}}
updates:
  - package-ecosystem: npm
    directory: /   # the site directory if it is not the repo root, e.g. /site
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Every Dependabot PR runs the full verify job. Don't re-run it each time main
    # moves; comment "@dependabot rebase" on one that conflicts.
    rebase-strategy: disabled
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Framework majors are planned migrations, not bot PRs.
      - dependency-name: astro
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/*"
        update-types: ["version-update:semver-major"]

  # Also bumps the pinned Ship Gate version (pauljosephdp/Ship-Gate@vX.Y.Z).
  # Weekly, so a new Ship Gate release reaches each site within a week, through that site's own PR gate.
  - package-ecosystem: github-actions
    directory: /   # always the repo root: workflows live there
    registries: [ship-gate]
    schedule:
      interval: weekly
      day: monday
    rebase-strategy: disabled
    # One PR for every action bump, the Ship Gate pin included.
    groups:
      actions:
        patterns: ["*"]
