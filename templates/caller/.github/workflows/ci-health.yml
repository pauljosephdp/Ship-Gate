# Closing the loop (AI-native SDLC, Maintain stage): weekly control bands over verify's
# duration and failure rate. A slow creep toward the 30-minute timeout, or a run of failures,
# is caught before it blocks merges: tier 2 gets a read-only Claude diagnosis in the job
# summary; tier 3 opens or updates one issue written as intent.md (docs/changes/README.md).
name: CI health

on:
  schedule:
    - cron: "41 6 * * 1"   # Mondays, 06:41 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  ci-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pauljosephdp/Ship-Gate/ci-health@v3.13.0
        with:
          workflow: ci.yml
          timeout-minutes: 30
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
