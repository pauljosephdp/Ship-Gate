# Ship Gate caller. Keep this job named "verify": it is the required check on main.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        # Full history, only if a site check needs git dates (e.g. sitemap lastmod).
        # with:
        #   fetch-depth: 0
      - uses: pauljosephdp/Ship-Gate@v1.1.0
        # Only if the site is not at the repo root (Playway: "site").
        # with:
        #   working-directory: site
