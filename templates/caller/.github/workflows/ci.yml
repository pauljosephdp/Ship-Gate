# Ship Gate caller. Keep this job named "verify": it is the required check on main.
#
# Where the gate runs (README → Where the gate runs):
# - Every push, draft or not, gets Ship Gate's fast stage inside the Cloudflare Workers
#   Builds preview build (scripts/ship-gate-workers.sh): guards, astro check, tests,
#   the site's checks and the post-build scans, for no Actions minutes.
# - This job adds the browser suite and Lighthouse, and runs only on a pull request
#   that is ready for review. A draft skips it (a draft cannot merge), so open a PR as
#   a draft while you iterate, run the browser suite locally, and mark it ready once.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Ship Gate deletes this branch's older report artifacts, keeping one run's at most.
  actions: write

jobs:
  verify:
    name: verify
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        # Full history, only if a site check needs git dates (e.g. sitemap lastmod).
        # with:
        #   fetch-depth: 0
      - uses: pauljosephdp/Ship-Gate@v3.8.0
        # Only if the site is not at the repo root, e.g. "site".
        # with:
        #   working-directory: site
