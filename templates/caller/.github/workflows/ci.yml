# Ship Gate caller. Keep this job named "verify": it is the required check on main.
#
# Where the gate runs (README → Where the gate runs):
# - Production-only delivery (v3.11.0): Cloudflare Workers Builds builds `main` and nothing
#   else, so there is no preview build and no "Workers Builds" check on a pull request.
#   This job runs the WHOLE gate there: contract, guards, astro check, lint, tests, the
#   site's checks, the build, the post-build scans, the browser suite and Lighthouse.
#   It runs only on a pull request that is ready for review; a draft skips it (a draft
#   cannot merge). Run the gate and the browser suite in a Claude Code cloud session first, then open the PR
#   ready, so verify runs once.
# - skip-fast: false runs the fast stage here. Set it to true only on a site that also
#   builds previews in Workers Builds (SHIP_GATE_REQUIRE_FAST=1) and whose main ruleset
#   requires the "Workers Builds: <worker>" check; without that check on the commit,
#   skip-fast waits 90 s and then runs the fast stage anyway.
# - A pull request that changes only docs/ or root Markdown passes verify without
#   running the gate: nothing the gate checks changed, and one job named "verify"
#   (not a second workflow) keeps the required check unambiguous.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  # Ship Gate deletes this branch's older report artifacts, keeping one run's at most.
  actions: write

jobs:
  verify:
    name: verify
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Docs-only change?
        id: scope
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          files="$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[].filename')"
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(docs/.*|[^/]+\.md)$'; then
            echo "Only docs/ and root Markdown changed: the gate has nothing to check."
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.scope.outputs.docs_only != 'true'
        # Full history, only if a site check needs git dates (e.g. sitemap lastmod).
        # with:
        #   fetch-depth: 0
      - uses: pauljosephdp/Ship-Gate@v3.13.0
        if: steps.scope.outputs.docs_only != 'true'
        with:
          skip-fast: false
          lighthouse-runs: 1
          # Only if the site is not at the repo root, e.g. "site".
          # working-directory: site

  # A failed verify gets a read-only Claude diagnosis on the pull request: likely cause, flaky
  # or real, three lines. Needs the ANTHROPIC_API_KEY secret; without it this notes that and passes.
  triage:
    name: triage
    needs: verify
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pauljosephdp/Ship-Gate/triage@v3.13.0
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
