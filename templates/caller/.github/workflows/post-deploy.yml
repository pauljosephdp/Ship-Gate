# Ship Gate post-deploy check. Your deploy pipeline deploys; this only verifies.
# Never add `wrangler deploy` here, or every merge deploys twice.
name: Post-deploy check

on:
  push:
    branches: [main]

permissions:
  contents: read

# A newer merge supersedes an older check: the older one would wait for a commit
# production no longer serves, then fail on a healthy deploy.
concurrency:
  group: post-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pauljosephdp/Ship-Gate/post-deploy@v3.0.0
