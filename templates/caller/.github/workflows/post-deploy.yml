# Ship Gate post-deploy check. Your deploy pipeline deploys; this only verifies.
# Never add `wrangler deploy` here, or every merge deploys twice.
name: Post-deploy check

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pauljosephdp/Ship-Gate/post-deploy@v2.2.0
        # with:
        #   working-directory: site
        #   crux-api-key: ${{ secrets.CRUX_API_KEY }}   # optional: field Core Web Vitals
