# Ship Gate post-deploy check — manual fallback.
# The check itself runs inside Cloudflare Workers Builds, straight after each
# production deploy, with no Actions runner: set the Workers Builds deploy command to
#   <your deploy command> && bash scripts/ship-gate-after-deploy.sh
# (README → Where the gate runs). Run this workflow by hand to re-check production.
# A site not deployed by Workers Builds triggers it on `push: branches: [main]` instead.
# Never add a deploy step here, or every merge deploys twice (and the
# workers-builds-only guard reads a wrangler write command here as one).
name: Post-deploy check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pauljosephdp/Ship-Gate/post-deploy@v3.8.0
        # with:
        #   working-directory: site
        #   crux-api-key: ${{ secrets.CRUX_API_KEY }}   # optional: field Core Web Vitals
