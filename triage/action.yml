name: Ship Gate — triage a failed build
description: >
  Read-only Claude triage of this workflow run's failed jobs (the AI-native SDLC CI/CD play):
  the likely cause, flaky or real, and a three-line summary posted on the pull request and in
  the job summary. Claude reads logs and code; it changes nothing. Needs actions: read and
  pull-requests: write. Without an API key it notes that and passes.
author: Ship Gate
inputs:
  anthropic-api-key:
    description: The repo's ANTHROPIC_API_KEY secret.
    default: ""
  claude-code-version:
    description: The Claude Code CLI version.
    default: 2.1.293
runs:
  using: composite
  steps:
    - name: Triage
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.claude-code-version }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        if [ -z "$ANTHROPIC_API_KEY" ]; then
          echo "::notice::No ANTHROPIC_API_KEY secret: failed-build triage skipped. Add the secret to turn it on."
          exit 0
        fi
        gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed 2>/dev/null | tail -c 200000 > "$RUNNER_TEMP/failed.log" || true
        [ -s "$RUNNER_TEMP/failed.log" ] || { echo "No failed-job log to triage."; exit 0; }
        npm install -g --no-audit --no-fund --loglevel=error "@anthropic-ai/claude-code@$VERSION"
        claude -p "Read the failed CI log at $RUNNER_TEMP/failed.log for $GITHUB_REPOSITORY. Identify the most likely cause, pointing at the file and line in this checkout when you can, say whether the failure looks flaky or real, and write a three-line summary for the pull request thread. Do not suggest skipping or weakening a test. Output only the summary." \
          --allowedTools "Read,Grep,Glob" --output-format text > "$RUNNER_TEMP/triage.md"
        { echo "## Failed-build triage (Claude)"; echo; cat "$RUNNER_TEMP/triage.md"; } | tee -a "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/comment.md"
        printf '\n\n_Read-only diagnosis of run %s/%s/actions/runs/%s. A person decides the fix._\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/comment.md"
        if [ -n "$PR" ]; then gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md" || echo "::notice::Could not comment on the PR (needs pull-requests: write)."; fi
